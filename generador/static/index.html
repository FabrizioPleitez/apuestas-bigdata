<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Apuestas Big Data</title>
<link rel="stylesheet" href="/static/estilos.css">
</head>
<body>

  <div class="topbar">
    <div class="logo">📊 ApuestasBigData</div>
    <div class="search-box">🔍 Buscar partidos...</div>
    <div class="topbar-actions">
      <button class="btn-outline">Entrar</button>
      <button class="btn-solid">Registro</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">DEPORTES</div>
      <div class="sport-item active">⚽ Mundial <span class="count" id="count-mundial">8</span></div>
      <div class="sport-item">🏀 Básquetbol <span class="count">0</span></div>
      <div class="sport-item">⚾ Béisbol <span class="count">0</span></div>
      <div class="sport-item">🎾 Tenis <span class="count">0</span></div>
      <div class="sport-item">🎮 eSports <span class="count">0</span></div>
    </div>

    <div class="main">
      <div class="main-header">
        <h1>Mundial</h1>
        <div class="pill active">Partidos</div>
      </div>

      <div class="section-label">Fase de grupos</div>

      <div id="lista-partidos" class="games-list"></div>
    </div>

    <div class="panel">
      <div id="panel-vacio" class="panel-vacio">
        <div class="panel-vacio-icono">🎟️</div>
        <div>Cupón vacío</div>
        <div class="panel-vacio-sub">Selecciona una cuota para apostar</div>
      </div>

      <div id="panel-lleno" class="panel-lleno oculto">
        <div class="panel-partido-nombre" id="panel-partido"></div>
        <div class="panel-seleccion" id="panel-seleccion"></div>

        <div class="panel-tabs">
          <div class="panel-tab active">Apostar</div>
        </div>

        <label class="panel-label">Monto</label>
        <input type="number" id="panel-monto" value="25" min="1" step="1">

        <div class="quick-amounts">
          <button data-add="1">+$1</button>
          <button data-add="5">+$5</button>
          <button data-add="10">+$10</button>
          <button data-add="100">+$100</button>
        </div>

        <button id="btn-apostar" class="btn-apostar">Apostar</button>
        <div id="panel-mensaje" class="panel-mensaje"></div>
        <div class="panel-legal">Al apostar, aceptas los Términos de Uso.</div>
      </div>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
